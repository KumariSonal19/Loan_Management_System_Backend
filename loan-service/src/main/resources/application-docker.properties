spring.application.name=loan-service

spring.datasource.url=jdbc:mysql://mysql:3306/loan_db
spring.datasource.username=loan_user
spring.datasource.password=loan_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

server.port=8082

eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=loan-service:${server.port}

spring.cloud.openfeign.enabled=true

feign.client.config.notification-service.connect-timeout=5000
feign.client.config.notification-service.read-timeout=5000

logging.level.root=INFO
logging.level.com.lms=DEBUG
spring.cloud.config.enabled=false
